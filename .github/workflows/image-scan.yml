name: Image security scan

on:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Trivy scan — ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docker.n8n.io/n8nio/n8n:stable
            label: n8n
          - image: slothcroissant/caddy-cloudflaredns:2.11.4
            label: caddy

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote  # avoid containerd socket permission errors on GH runners
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ matrix.label }}.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'  # advisory only — tighten to '1' after triaging baseline, see #68

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f  # codeql-bundle-v2.26.2
        with:
          sarif_file: trivy-${{ matrix.label }}.sarif
          category: trivy-${{ matrix.label }}

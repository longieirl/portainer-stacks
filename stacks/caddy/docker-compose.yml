services:
  caddy:
    image: slothcroissant/caddy-cloudflaredns:2.11.4
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DOCKER_DATA_HOME}/caddy_data:/data
      - ${DOCKER_DATA_HOME}/caddy_config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    networks:
      - proxy_net
      - remote-access
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}

  cloudflared:
    image: cloudflare/cloudflared:2026.7.0
    container_name: cloudflared-caddy
    restart: unless-stopped
    # --metrics localhost:7834 restricts Prometheus metrics to loopback only
    command: tunnel --no-autoupdate --metrics localhost:7834 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m

configs:
  caddyfile:
    # yamllint disable rule:line-length
    content: |
      {
          acme_dns cloudflare {env.CLOUDFLARE_API_TOKEN}
          auto_https disable_redirects
          servers {
              trusted_proxies static private_ranges
              protocols h1 h2
          }
          log {
              output file /data/caddy-access.log {
                  roll_size 10mb
                  roll_keep 10
                  roll_keep_for 720h
              }
              format json
              level INFO
          }
      }

      # Block common scanner/bot probe paths across all sites.
      (block_scanners) {
          @scanners {
              path /.env /.env.* /.git /.git/* /.gitconfig
              path /.htpasswd /.htaccess /.DS_Store /.ssh/* /.aws/*
              path /web.config /database.yml
              path /wp-login.php /wp-admin/* /wp-config.php /xmlrpc.php
              path /wp-includes/* /wp-content/*
              path /administrator /administrator/*
              path /phpinfo.php /info.php /php.php /test.php /setup.php
              path /server-status /server-info /cgi-bin/*
              path /actuator /actuator/*
              path /phpmyadmin /phpmyadmin/* /pma /pma/* /adminer.php
              path /cpanel /cpanel/* /plesk/* /webmin/*
          }
          respond @scanners 403
      }

      (security_headers) {
          header {
              Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
              X-Frame-Options "SAMEORIGIN"
              X-Content-Type-Options "nosniff"
              Referrer-Policy "strict-origin-when-cross-origin"
              Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()"
              X-XSS-Protection "1; mode=block"
              Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'self'"
              -Server
              -X-Powered-By
          }
      }

      (body_limit) {
          request_body {
              max_size 50MB
          }
      }

      http://n8n.longie.net {
          reverse_proxy n8n:5678
      }

      portainer.longie.net {
          import block_scanners
          import security_headers
          import body_limit
          reverse_proxy 192.168.1.6:9443 {
              header_up Host portainer.longie.net
              header_up Origin https://portainer.longie.net
              transport http {
                  tls_insecure_skip_verify
              }
          }
      }

      sonarr.longie.net {
          import block_scanners
          import security_headers
          import body_limit
          reverse_proxy 192.168.1.6:8989
      }

      jackett.longie.net {
          import block_scanners
          import security_headers
          import body_limit
          reverse_proxy 192.168.1.6:9117
      }

      qbt.longie.net {
          import block_scanners
          import security_headers
          import body_limit
          reverse_proxy 192.168.1.6:8080
      }

      deluge.longie.net {
          import block_scanners
          import security_headers
          import body_limit
          reverse_proxy 192.168.1.6:8112
      }

      # NOTE: Auth enforced by Cloudflare Access at edge. Caddy only routes.
      # Webhook bypass paths are configured in Access policies, not here.
      n8n.longie.net {
          import block_scanners
          import security_headers
          import body_limit
          reverse_proxy n8n:5678
      }

    # yamllint enable rule:line-length

networks:
  proxy_net:
    name: proxy_net
    driver: bridge
  remote-access:
    name: remote-access
    external: true

services:
  caddy:
    image: slothcroissant/caddy-cloudflaredns:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DOCKER_DATA_HOME}/caddy_data:/data
      - ${DOCKER_DATA_HOME}/caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - proxy_net
      - remote-access
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}

  cloudflared:
    image: cloudflare/cloudflared:2026.7.0
    container_name: cloudflared-caddy
    restart: unless-stopped
    # --metrics localhost:7834 restricts Prometheus metrics to loopback only
    command: tunnel --no-autoupdate --metrics localhost:7834 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m

networks:
  proxy_net:
    name: proxy_net
    driver: bridge
  remote-access:
    name: remote-access
    external: true

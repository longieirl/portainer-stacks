services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    hostname: gluetun
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=Europe/Dublin
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=10.14.0.2/16
      - UPDATER_PERIOD=24h
      - VPN_SERVICE_PROVIDER=surfshark
      - SERVER_COUNTRIES=United States
      - SERVER_CITIES=New York
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.6/32
    volumes:
      - ${DOCKER_DATA_HOME}/gluetun:/gluetun
      - ${DOCKER_DATA_HOME}/port_forward:/tmp/gluetun/forwarded_port
    ports:
      - 127.0.0.1:3020:8000/tcp   # Built-in HTTP control server (used by healthcheck)
      - 192.168.1.6:8080:8080     # QB WebUI — LAN direct + Caddy (qbt.longie.net)
      - 127.0.0.1:8999:8999       # QB torrenting port
      - 127.0.0.1:49153:49152     # Deluge (49152 reserved by macOS rapportd)
      - 127.0.0.1:49153:49152/udp # Deluge
      - 192.168.1.6:8112:8112     # Deluge WebUI — LAN direct only
      - 127.0.0.1:6881:6881       # QB
      - 127.0.0.1:6881:6881/udp   # QB
      - 192.168.1.6:9117:9117     # Jackett — LAN direct only
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/v1/vpnstatus"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "container:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
      - UMASK=022
      - WEBUI_PORT=8080
      - TORRENTING_PORT=8999
    volumes:
      - ${DOCKER_DATA_HOME}/torrent/config:/config
      - ${DOCKER_SHARED_HOME}/qtorrents:/downloads
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 512m

  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    network_mode: "container:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
      - DELUGE_LOGLEVEL=info
    volumes:
      - ${DOCKER_DATA_HOME}/deluge/config:/config
      - ${DOCKER_SHARED_HOME}/downloads:/downloads
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 512m

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    network_mode: "container:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
      - AUTO_UPDATE=false
    volumes:
      - ${DOCKER_DATA_HOME}/jackett/config:/config
      - ${DOCKER_SHARED_HOME}/downloads:/downloads
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 512m

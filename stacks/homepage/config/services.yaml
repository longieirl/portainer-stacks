---
- Media:
    - Plex:
        href: https://app.plex.tv
        description: Media server
        icon: plex.png
        widget:
          type: plex
          url: http://host.docker.internal:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
          fields: ["streams", "movies", "tv"]
    - Tautulli:
        href: https://tautulli.longie.net
        description: Plex monitoring
        icon: tautulli.png
        widget:
          type: tautulli
          url: http://tautulli:8181
          key: "{{HOMEPAGE_VAR_TAUTULLI_API_KEY}}"
    - Seerr:
        href: https://seerr.longie.net
        description: Media requests
        icon: overseerr.png
        widget:
          type: seerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"
          fields: ["pending", "processing", "available"]
    - Sonarr:
        href: https://sonarr.longie.net
        description: TV show management
        icon: sonarr.png
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
          fields: ["wanted", "queued", "series"]

- Downloads:
    - qBittorrent:
        href: https://qbt.longie.net
        description: Torrent client
        icon: qbittorrent.png
        widget:
          type: qbittorrent
          url: http://192.168.1.6:8080
          username: "{{HOMEPAGE_VAR_QBIT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBIT_PASSWORD}}"
    - Jackett:
        href: http://192.168.1.6:9117
        description: Torrent indexer proxy
        icon: jackett.png

- Infrastructure:
    - Portainer:
        href: https://portainer.longie.net
        description: Container management
        icon: portainer.png
    - n8n:
        href: https://n8n.longie.net
        description: Workflow automation
        icon: n8n.png

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "192.168.1.6:3000:3000"
    volumes:
      - ${DOCKER_DATA_HOME}/homepage/config:/app/config
    configs:
      - source: homepage_services
        target: /app/config/services.yaml
      - source: homepage_settings
        target: /app/config/settings.yaml
      - source: homepage_widgets
        target: /app/config/widgets.yaml
      - source: homepage_bookmarks
        target: /app/config/bookmarks.yaml
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Dublin
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-home.longie.net,192.168.1.6:3000}
      - HOMEPAGE_VAR_PLEX_TOKEN=${PLEX_TOKEN}
      - HOMEPAGE_VAR_TAUTULLI_API_KEY=${TAUTULLI_API_KEY}
      - HOMEPAGE_VAR_SONARR_API_KEY=${SONARR_API_KEY}
      - HOMEPAGE_VAR_SEERR_API_KEY=${SEERR_API_KEY}
      - HOMEPAGE_VAR_QBIT_USERNAME=${QBIT_USERNAME}
      - HOMEPAGE_VAR_QBIT_PASSWORD=${QBIT_PASSWORD}
      - HOMEPAGE_VAR_DELUGE_PASSWORD=${DELUGE_PASSWORD}
    networks:
      - proxy_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

configs:
  homepage_services:
    # yamllint disable rule:line-length
    content: |
      ---
      - Media:
          - Plex:
              href: https://app.plex.tv
              description: Media server
              icon: plex.png
              widget:
                type: plex
                url: http://host.docker.internal:32400
                key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
                fields: ["streams", "movies", "tv"]
          - Tautulli:
              href: https://tautulli.longie.net
              description: Plex monitoring
              icon: tautulli.png
              widget:
                type: tautulli
                url: http://tautulli:8181
                key: "{{HOMEPAGE_VAR_TAUTULLI_API_KEY}}"
          - Seerr:
              href: https://seerr.longie.net
              description: Media requests
              icon: overseerr.png
              widget:
                type: seerr
                url: http://seerr:5055
                key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"
                fields: ["pending", "processing", "available"]
          - Sonarr:
              href: https://sonarr.longie.net
              description: TV show management
              icon: sonarr.png
              widget:
                type: sonarr
                url: http://sonarr:8989
                key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
                fields: ["wanted", "queued", "series"]

      - Downloads:
          - qBittorrent:
              href: https://qbt.longie.net
              description: Torrent client
              icon: qbittorrent.png
              widget:
                type: qbittorrent
                url: http://192.168.1.6:8080
                username: "{{HOMEPAGE_VAR_QBIT_USERNAME}}"
                password: "{{HOMEPAGE_VAR_QBIT_PASSWORD}}"
          - Deluge:
              href: http://192.168.1.6:8112
              description: Torrent client
              icon: deluge.png
              widget:
                type: deluge
                url: http://192.168.1.6:8112
                password: "{{HOMEPAGE_VAR_DELUGE_PASSWORD}}"
          - Jackett:
              href: http://192.168.1.6:9117
              description: Torrent indexer proxy
              icon: jackett.png

      - Infrastructure:
          - Portainer:
              href: https://portainer.longie.net
              description: Container management
              icon: portainer.png
          - n8n:
              href: https://n8n.longie.net
              description: Workflow automation
              icon: n8n.png

      - System:
          - CPU:
              icon: glances.png
              description: Processor
              widget:
                type: glances
                url: http://host.docker.internal:61208
                metric: cpu
                version: 4
          - Memory:
              icon: glances.png
              description: RAM
              widget:
                type: glances
                url: http://host.docker.internal:61208
                metric: memory
                version: 4
          - Disk:
              icon: glances.png
              description: Storage
              widget:
                type: glances
                url: http://host.docker.internal:61208
                metric: disk
                version: 4
          - Network:
              icon: glances.png
              description: Network I/O
              widget:
                type: glances
                url: http://host.docker.internal:61208
                metric: network:en0
                version: 4
    # yamllint enable rule:line-length

  homepage_settings:
    content: |
      ---
      title: Longie Home
      theme: dark
      color: slate
      headerStyle: boxed
      layout:
        Media:
          columns: 4
          style: row
        Downloads:
          columns: 2
          style: row
        Infrastructure:
          columns: 2
          style: row
        System:
          columns: 4
          style: row

  homepage_widgets:
    content: |
      ---
      - datetime:
          text_size: xl
          format:
            timeStyle: short
            dateStyle: short
            hour12: true

  homepage_bookmarks:
    content: |
      ---

networks:
  proxy_net:
    name: proxy_net
    external: true

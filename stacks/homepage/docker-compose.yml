services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "192.168.1.6:3000:3000"
    volumes:
      - ${DOCKER_DATA_HOME}/homepage/config:/app/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Dublin
      - HOMEPAGE_ALLOWED_HOSTS=home.longie.net
      - HOMEPAGE_VAR_PLEX_TOKEN=${PLEX_TOKEN}
      - HOMEPAGE_VAR_TAUTULLI_API_KEY=${TAUTULLI_API_KEY}
      - HOMEPAGE_VAR_SONARR_API_KEY=${SONARR_API_KEY}
      - HOMEPAGE_VAR_SEERR_API_KEY=${SEERR_API_KEY}
      - HOMEPAGE_VAR_QBIT_USERNAME=${QBIT_USERNAME}
      - HOMEPAGE_VAR_QBIT_PASSWORD=${QBIT_PASSWORD}
    networks:
      - proxy_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy_net:
    name: proxy_net
    external: true

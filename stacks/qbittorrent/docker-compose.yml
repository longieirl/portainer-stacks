services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "container:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
      - UMASK=022
      - WEBUI_PORT=8080
      - TORRENTING_PORT=8999
    volumes:
      - ${DOCKER_DATA_HOME}/torrent/config:/config
      - ${DOCKER_SHARED_HOME}/qtorrents:/downloads
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    mem_limit: 512m

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
    volumes:
      - ${DOCKER_DATA_HOME}/sonarr/config:/config
      - ${DOCKER_SHARED_HOME}/downloads:/downloads
    ports:
      - 192.168.1.6:8989:8989
    networks:
      - proxy_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    restart: unless-stopped

networks:
  proxy_net:
    name: proxy_net
    external: true
